name: refresh
on:
  schedule:
    - cron: "23 * * * *"  # hourly
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  models: read   # GitHub Models (free tier) for the AI paragraphs
concurrency: refresh

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipeline/test_explain.py
      - run: python pipeline/fetch.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: commit AI cache (only when new paragraphs were written)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_cache.json
          git diff --cached --quiet || (git commit -m "ai cache: $(date -u +%FT%H:%M)" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
